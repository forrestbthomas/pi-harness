name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-go@v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.21"
      - name: Build release binaries
        run: bash scripts/build-release.sh "${GITHUB_REF_NAME}"
      - name: Upload release artifacts
        # softprops/action-gh-release@v3
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          files: bin/pi-run-*
          generate_release_notes: true
      - name: Update Homebrew tap formula
        env:
          GH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
        run: |
          bash scripts/update-homebrew-formula.sh "${GITHUB_REF_NAME}"
