name: nightly-live-eval

permissions:
  contents: read

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  live-eval:
    runs-on: ubuntu-latest
    # Requires a provider key in the repo secrets; skips gracefully if absent.
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      # actions/checkout@v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-go@v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.5'
      # actions/setup-python@v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: eval/requirements.txt
      - name: Install deps
        run: |
          python -m venv eval/.venv
          eval/.venv/bin/pip install -r eval/requirements.txt
      - name: Run full eval
        run: eval/.venv/bin/python -m pytest tests/ -v
        working-directory: eval
