# Provider scorecard gate (pi-run ci-benchmark).
# INTENTIONAL: weekly/manual only (live provider runs cost money), never on
# every push; providers run sequentially for clean per-provider cost
# attribution; provider keys come from repo secrets only and are never echoed
# or logged (the CLI only logs key names). See
# docs/governance/specs-archive/2026-08-11-ci-benchmark-scorecard-design.md §4.6.
name: provider-scorecard

permissions:
  contents: read

on:
  workflow_dispatch:    # manual run
  schedule:
    - cron: '0 3 * * 1' # weekly Monday 03:00 — not on every push (cost)

jobs:
  scorecard:
    runs-on: ubuntu-latest # Docker is preinstalled on GitHub-hosted runners
    env:
      PI_SELF_HEAL: '1'   # record watchdog/group-kill/recovery events to .pi/heal/events.jsonl for the scorecard (EVAL-4)
    steps:
      # actions/checkout@v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-go@v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26'
      - name: Build pi-run
        run: |
          go build -ldflags "-X github.com/forrestbthomas/pi-harness/internal/cli.Version=$(git describe --tags --always)" -o bin/pi-run ./cmd/pi-run
          # Put the repo bin/ on PATH for later steps (GitHub runner shells do
          # not include the workspace bin/ by default).
          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"
      - name: Set up Node via nvm + install the Pi CLI
        # pi-run resolves the pi binary from the HIGHEST nvm-managed Node
        # toolchain (~/.nvm/versions/node/<v>/bin/pi) — see internal/cli/pi.go
        # resolveNodeVersion. GitHub-hosted runners ship nvm; we must install
        # node + pi under nvm so the CLI finds pi, NOT into the PATH node from
        # actions/setup-node. Pin an explicit version: `nvm install latest`
        # fails on current runner images ("Version 'latest' not found"); set
        # PI_NODE_VERSION to the SAME version so the CLI resolves the exact
        # toolchain we installed.
        #
        # Install the REAL Pi coding agent (@earendil-works/pi-coding-agent):
        # the plain `pi` npm package is an unrelated legacy CLI that prints "3"
        # for every invocation (silent garbage in the nightly/scorecard runs).
        env:
          PI_NODE_VERSION: 'v22.19.0'
        run: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
          nvm install "${PI_NODE_VERSION:-v22.19.0}"
          # Install the Pi coding agent into the active nvm-managed Node
          # toolchain. The unscoped `pi` npm package is an UNRELATED
          # pi-digits calculator ("pi-number"), not the coding agent.
          npm install -g --ignore-scripts @earendil-works/pi-coding-agent
          echo "nvm node: $(nvm which current)"
          echo "pi path:  $(command -v pi)"
          # The coding agent reports a semver (e.g. 0.84.1); the legacy
          # impostor prints "3". Refuse to run the scorecard on a wrong CLI.
          pi --version | grep -Eq '^[0-9]+\.[0-9]+\.' || {
            echo "::error::installed pi CLI is not the Pi coding agent " \
                 "(pi --version: $(pi --version 2>&1 | head -1))"
            exit 1
          }
      - name: Pull last scorecard (baseline)
        # actions/download-artifact@v7
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: benchmark-scorecard
          path: eval/benchmark-results/
        continue-on-error: true # first run has no baseline yet
      - name: Record pi version for scorecard provenance
        # EVAL-14: the ci-benchmark scorecard's provenance.piVersion must be a
        # real version (or "unknown"), matching the nightly live surface
        # (EVAL-3). The Go scorecard reads the Version ldflags stamp; recording
        # it here also surfaces it in the step env for downstream checks.
        run: |
          echo "PI_VERSION=$(pi-run version 2>/dev/null || echo unknown)" >> "$GITHUB_ENV"
      - name: Run provider scorecard gate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        # PI_NODE_VERSION pins the nvm toolchain the CLI resolves (matches the
        # nvm install above when set; otherwise the CLI uses the highest nvm
        # version, which is the one we installed).
        #
        # Baseline: the CLI now owns eval/benchmark-results/scorecard-latest.json
        # (writeScorecardLatest in internal/cli/scorecard.go), so this step only
        # needs to pass --baseline when the downloaded prior artifact exists.
        # The old shell `cp` glue that derived scorecard-latest.json from
        # scorecard-<run>.json is gone — the CLI writes it deterministically.
        run: |
          BASELINE=""
          if [ -f eval/benchmark-results/scorecard-latest.json ]; then
            BASELINE="--baseline eval/benchmark-results/scorecard-latest.json"
          fi
          pi-run ci-benchmark --providers openai,deepseek \
          --fail-below 0.8 --max-budget-usd 5.0 $BASELINE
      - name: Upload scorecard (becomes next run's baseline)
        # Upload on EVERY gate outcome (EVAL-1): a failed gate is exactly when
        # the scorecard evidence matters most.
        if: always()
        # actions/upload-artifact@v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: benchmark-scorecard
          # Ship the timestamped run file(s) plus the CLI-owned latest pointer;
          # the download step restores all prior files so the artifact grows ~1
          # file per run. 90 days keeps it bounded.
          path: |
            eval/benchmark-results/scorecard-*.json
            eval/benchmark-results/scorecard-latest.json
          retention-days: 90
