# Provider scorecard gate (pi-run ci-benchmark).
# INTENTIONAL: weekly/manual only (live provider runs cost money), never on
# every push; providers run sequentially for clean per-provider cost
# attribution; provider keys come from repo secrets only and are never echoed
# or logged (the CLI only logs key names). See
# docs/superpowers/specs/2026-08-11-ci-benchmark-scorecard-design.md §4.6.
name: provider-scorecard

permissions:
  contents: read

on:
  workflow_dispatch:    # manual run
  schedule:
    - cron: '0 3 * * 1' # weekly Monday 03:00 — not on every push (cost)

jobs:
  scorecard:
    runs-on: ubuntu-latest # Docker is preinstalled on GitHub-hosted runners
    steps:
      # actions/checkout@v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-go@v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26'
      - name: Build pi-run
        run: go build -o bin/pi-run ./cmd/pi-run
      - name: Set up node + install the Pi CLI
        # actions/setup-node@v7
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - run: npm install -g pi # the published package the harness launches as `pi`
      - name: Pull last scorecard (baseline)
        # actions/download-artifact@v7
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: benchmark-scorecard
          path: eval/benchmark-results/
        continue-on-error: true # first run has no baseline yet
      - name: Run provider scorecard gate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: >-
          pi-run ci-benchmark --providers openai,deepseek
          --fail-below 0.8 --max-budget-usd 5.0
          --baseline eval/benchmark-results/scorecard-latest.json
      - name: Upload scorecard (becomes next run's baseline)
        # actions/upload-artifact@v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: benchmark-scorecard
          path: eval/benchmark-results/scorecard-*.json
          retention-days: 90
