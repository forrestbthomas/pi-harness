# Nightly live agent evaluation — two-speed pipeline (spec §4.3 of
# docs/superpowers/specs/2026-08-12-live-agent-eval-v2-design.md).
#
#   deterministic: hermetic suite that ALWAYS runs — no provider key needed.
#   live: real agent runs (pi-run print + DeepEval judge metrics) gated by a
#     per-case baseline (eval/scripts/score_run.py). A missing
#     OPENAI_API_KEY is a HARD FAIL — never a silent skip: a skipped eval is
#     indistinguishable from a passed one.
name: nightly-live-eval

permissions:
  contents: read

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-live-eval
  cancel-in-progress: true

jobs:
  deterministic:
    # Always runs; exercises the hermetic suite and the contract tests from
    # the eval-hardening lane. No provider key required.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # actions/checkout@v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-go@v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.5'
      - name: Build pi-run
        # The suite includes binary-spawning tests (config-check and the
        # contract tests); build pi-run fresh so they never depend on a
        # preinstalled binary on the runner.
        run: |
          go build -o bin/pi-run ./cmd/pi-run
          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"
      # actions/setup-python@v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: eval/requirements.txt
      - name: Install deps
        run: |
          python -m venv eval/.venv
          eval/.venv/bin/pip install -r eval/requirements.txt
      - name: Run deterministic suite
        # Hermetic + contract tests (test_contract_* from the eval-hardening
        # lane) + the dataset lint and the score_run unit tests (both fully
        # hermetic). test_score_run.py MUST run here, not just in the live
        # job, so its unit tests execute in CI without a provider key.
        run: .venv/bin/python -m pytest tests/test_harness_config.py tests/test_secret_resolution.py tests/test_dataset_schema.py tests/test_benchmark_format.py tests/test_code_quality.py tests/test_contract_mcp.py tests/test_contract_otel.py tests/test_contract_launch.py tests/test_contract_project_understand.py tests/test_score_run.py -v
        working-directory: eval

  live:
    # Real agent runs + judge metrics; key-missing => HARD FAIL (decision 3 in
    # the spec). Sequential, budgeted (PI_MAX_BUDGET_USD) and N-run averaged
    # against the per-case baseline.
    runs-on: ubuntu-latest
    needs: deterministic
    timeout-minutes: 30
    env:
      EVAL_RUNS_PER_CASE: '3'
      PI_MAX_BUDGET_USD: '2'               # nightly spend cap (cheap agent tier)
      OPENAI_MODEL_NAME: 'gpt-4.1-mini'    # cheap judge — real catalog model (deepeval 4.1.7 reads OPENAI_MODEL_NAME, not DEEPEVAL_MODEL)
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      # actions/checkout@v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-go@v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.5'
      - name: Build pi-run
        run: |
          go build -o bin/pi-run ./cmd/pi-run
          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"
      # actions/setup-python@v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: eval/requirements.txt
      - name: Install deps
        run: |
          python -m venv eval/.venv
          eval/.venv/bin/pip install -r eval/requirements.txt
      - name: Set up Node via nvm + install the Pi CLI
        # pi-run resolves the pi binary from the HIGHEST nvm-managed Node
        # toolchain (~/.nvm/versions/node/<v>/bin/pi) — see internal/cli/pi.go
        # resolveNodeVersion. GitHub-hosted runners ship nvm; we must install
        # node + pi under nvm so the CLI finds pi, NOT into the PATH node from
        # actions/setup-node. Pin an explicit version: `nvm install latest`
        # fails on current runner images ("Version 'latest' not found"), so we
        # pin Node 22.19.0 and set PI_NODE_VERSION to the SAME version so the
        # CLI resolves the exact toolchain we installed.
        #
        # Install the REAL Pi coding agent (@earendil-works/pi-coding-agent).
        # The plain `pi` npm package is an unrelated legacy CLI (a digits-of-pi
        # calculator) that exits 0 printing "3" for every invocation — the
        # nightly's agent runs silently produced "3\n" (0 tokens, ~50ms), and
        # every grader correctly failed on it (run 31652076075). The version
        # probe below fails loudly instead of evaling garbage again.
        env:
          PI_NODE_VERSION: 'v22.19.0'
        run: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
          nvm install "${PI_NODE_VERSION:-v22.19.0}"
          # Install pi into the active nvm-managed Node toolchain.
          npm install -g @earendil-works/pi-coding-agent
          echo "nvm node: $(nvm which current)"
          echo "pi path:  $(command -v pi)"
          # The coding agent reports a semver (e.g. 0.84.1); the legacy
          # impostor prints "3". Refuse to run the eval on a wrong CLI.
          pi --version | grep -Eq '^[0-9]+\.[0-9]+\.' || {
            echo "::error::installed pi CLI is not the Pi coding agent " \
                 "(pi --version: $(pi --version 2>&1 | head -1))"
            exit 1
          }
      - name: Key presence gate
        # Decision 3 — hard fail, never skip. A skipped eval is
        # indistinguishable from a passed one; the deterministic job above
        # still runs either way.
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::nightly-live-eval: OPENAI_API_KEY is missing — live eval cannot run. A skipped eval is indistinguishable from a passed one; refusing to report green."
            exit 1
          fi
      - name: Prepare live results dir
        run: mkdir -p eval/live-results
      - name: Run live suite
        # N agent runs per case (EVAL_RUNS_PER_CASE) + the judged metrics
        # layer + the E2E task-completion test. The eval report is written by
        # eval/conftest.py's pytest_runtest_logreport hook when PI_EVAL_REPORT
        # is set (pytest-json-report 1.5.0 silently fails to write under
        # pytest 9.1.1, so we do not depend on it). The path is repo-relative
        # and matches what score_run.py reads in the next step.
        env:
          # Relative to this step's working directory (eval/), so the hook
          # writes eval/live-results/report.json from the repo root — the
          # same path score_run.py reads in the next step.
          PI_EVAL_REPORT: live-results/report.json
        run: .venv/bin/python -m pytest tests/test_live_suite.py tests/test_live_metrics.py tests/test_agent_task_completion.py -v
        working-directory: eval
      - name: Run baseline gate
        # Per-case pass-rate tolerance 0.05 and cost-per-task >2x baseline fail
        # the run; the total budget cap is enforced by PI_MAX_BUDGET_USD (exit
        # 6 surfaced as a gate failure). Baseline is deliberate and reviewed —
        # the nightly never updates its own baseline.
        run: eval/.venv/bin/python eval/scripts/score_run.py --report eval/live-results/report.json --baseline eval/baselines/live-baseline.json --tolerance 0.05 --runs 3 --budget-usd 2.0 --out eval/live-results/live-$(date +%Y%m%dT%H%M%S).json
      - name: Upload live results
        # actions/upload-artifact@v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: live-eval-results
          path: eval/live-results/
          retention-days: 90
