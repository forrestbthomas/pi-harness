name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: 3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7
      - uses: b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # actions/setup-go@v7
        with:
          go-version: "1.21"
      - name: Build release binaries
        run: bash scripts/build-release.sh "${GITHUB_REF_NAME}"
      - name: Upload release artifacts
        uses: c12583777ecdfd3be55c69cf75464299dc01057e  # softprops/action-gh-release@v3
        with:
          files: bin/pi-run-*
          generate_release_notes: true
      - name: Update Homebrew tap formula
        env:
          GH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
        run: |
          bash scripts/update-homebrew-formula.sh "${GITHUB_REF_NAME}"
