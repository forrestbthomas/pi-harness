name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-go@v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.26.5"
      - name: Verify tag is an ancestor of main
        # Guard against tagging a commit that never landed on main (squash
        # merges rewrite hashes): the release must be cut from merged main so
        # git describe/ancestry walks from main always resolve the tag. Both
        # v0.9.1 and v0.9.2 were initially tagged pre-merge and had to be
        # repointed; this makes that state a hard failure instead.
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "${GITHUB_REF_NAME}" FETCH_HEAD; then
            echo "::error::tag ${GITHUB_REF_NAME} is not an ancestor of main — cut releases only from merged main (PR first, then tag the fetched main tip)"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} verified as ancestor of main"
      - name: Build release binaries
        run: bash scripts/build-release.sh "${GITHUB_REF_NAME}"
      - name: Upload release artifacts
        # softprops/action-gh-release@v3
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          files: bin/pi-run-*
          generate_release_notes: true
      - name: Update Homebrew tap formula
        env:
          GH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
        run: |
          bash scripts/update-homebrew-formula.sh "${GITHUB_REF_NAME}"
      - name: Verify Homebrew install (REL-3)
        # A tag shipped with a broken brew install is a silent distribution lie
        # (the formula push was fire-and-forget). Install into a temp prefix and
        # assert `pi-run version` == the tag.
        run: |
          bash scripts/verify-homebrew-formula.sh "${GITHUB_REF_NAME}"
